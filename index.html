<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель модератора</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blobs" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
  <canvas id="drops" aria-hidden="true"></canvas>

  <main class="hero">
    <section class="glass hero-card reveal" style="--i:0">
      <div class="logo reveal" style="--i:1">🛡️</div>
      <h1 class="reveal" style="--i:2">Панель модератора</h1>
      <p class="lead reveal" style="--i:3">
        Войди через Discord, выбери сервер, которым управляешь, и начни работу.
        Мы видим только твой профиль и список серверов.
      </p>
      <a class="btn reveal" style="--i:4" href="#" id="loginBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Войти через Discord
      </a>
      <div class="notice" id="notice" role="alert"></div>
      <p class="reveal" style="--i:5; margin-top:22px; font-size:13px"><a href="terms.html">Условия пользования</a> · <a href="privacy.html">Политика конфиденциальности</a></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="drops.js"></script>
  <script>
    const messages = {
      not_configured: 'Сайт ещё не настроен: впиши Client ID приложения Discord в файл config.js (см. README).',
      access_denied: 'Вход отменён. Попробуй ещё раз.',
      bad_state: 'Не удалось проверить ответ Discord. Попробуй войти ещё раз.',
      session_expired: 'Сессия истекла. Войди заново.',
      api_error: 'Не удалось связаться с Discord. Попробуй позже.'
    };
    const notice = document.getElementById('notice');
    const show = (code) => { notice.textContent = messages[code] || 'Что-то пошло не так.'; notice.classList.add('show'); };

    const err = new URLSearchParams(location.search).get('error');
    if (err) show(err);

    // Уже вошли в этой вкладке: сразу на панель
    if (ModApp.getAuth()) location.replace('dashboard.html');

    document.getElementById('loginBtn').addEventListener('click', (e) => {
      e.preventDefault();
      if (!ModApp.login()) show('not_configured');
    });
  </script>
</body>
</html>
